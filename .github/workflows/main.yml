name: Generate contribution games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Breakout SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Taveer09
          github_token: ${{ secrets.CONTRIBUTION_TOKEN }}
          games: "breakout"

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
